<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎁 선물이 도착했어요</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --green:#00704A; --house:#1e3932; --cream:#f7f3ea; --gold:#c8a96a; --ink:#1e3932; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(165deg,#1e3932 0%,#0c5c44 100%); padding:24px; color:var(--ink); overflow-x:hidden;
  }
  .card {
    width:100%; max-width:420px; background:var(--cream); border-radius:26px; padding:38px 26px 30px;
    box-shadow:0 16px 48px rgba(0,0,0,.32); text-align:center; position:relative; z-index:2;
    border:1px solid rgba(0,112,74,.12);
  }
  .brand { font-family:"Montserrat",sans-serif; font-weight:800; letter-spacing:.34em; font-size:13px; color:var(--green); margin-bottom:4px; }

  /* 1단계: 포장 */
  #wrap .gift { font-size:92px; line-height:1; display:inline-block; animation:wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  #wrap h1 { font-size:23px; font-weight:800; margin:18px 0 6px; }
  #wrap p { color:#5e6b66; font-size:15px; margin:0 0 26px; font-weight:500; }
  .openBtn {
    border:none; background:var(--green); color:#fff; font-size:17px; font-weight:700;
    padding:16px 34px; border-radius:999px; cursor:pointer; box-shadow:0 8px 20px rgba(0,112,74,.4);
    animation:pulse 1.4s ease-in-out infinite; font-family:inherit;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

  /* 2단계: 리빌 */
  #reveal { display:none; }
  #reveal.show { display:block; animation:pop .5s cubic-bezier(.2,1.3,.4,1); }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .emoji { font-size:52px; line-height:1; }
  #reveal h1 { font-size:22px; font-weight:800; margin:12px 0 2px; color:var(--green); }
  #reveal .sub { color:#5e6b66; font-size:14px; margin:0 0 24px; font-weight:500; }
  .label { font-size:12px; color:#8a958f; margin-bottom:8px; letter-spacing:.06em; font-weight:600; }
  .code-row { display:flex; align-items:stretch; gap:8px; }
  .code {
    flex:1; font-size:23px; font-weight:700; letter-spacing:.05em; padding:16px 12px;
    background:#fff; border:2px dashed var(--gold); border-radius:14px; color:var(--house);
    word-break:break-all; display:flex; align-items:center; justify-content:center; min-height:58px;
  }
  button.copy {
    flex:0 0 auto; border:none; background:var(--green); color:#fff; font-size:15px; font-weight:700;
    padding:0 16px; border-radius:14px; cursor:pointer; transition:transform .08s,background .2s; font-family:inherit;
  }
  button.copy:active { transform:scale(.94); }
  button.copy.done { background:var(--house); }
  .steps { text-align:left; margin:24px 0 0; padding:18px; background:#fff; border-radius:14px; font-size:14px; color:#5e6b66; line-height:1.7; font-weight:500; }
  .steps b { color:var(--house); font-weight:700; }
  .steps ol { margin:8px 0 0; padding-left:20px; }
  .foot { margin-top:18px; font-size:12px; color:#a9b3ad; font-weight:500; }

  .confetti { position:fixed; top:-30px; font-size:22px; z-index:1; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:.2; } }
</style>
</head>
<body>
  <div class="card">
    <!-- 1단계 -->
    <div id="wrap">
      <div class="brand">A GIFT FOR YOU</div>
      <div class="gift">🎁</div>
      <h1>마니또 선물이 도착했어요!</h1>
      <p>안에 뭐가 들었을까요? 🤫</p>
      <button class="openBtn" id="openBtn">🎀 눌러서 열어보기</button>
    </div>

    <!-- 2단계 -->
    <div id="reveal">
      <div class="brand">STARBUCKS e-GIFT</div>
      <div class="emoji">☕🎉</div>
      <h1>스타벅스 모바일 상품권이에요!</h1>
      <p class="sub">따뜻한 커피 한 잔 어때요? ☕</p>

      <div class="label">모바일 상품권 번호</div>
      <div class="code-row">
        <div class="code" id="code">코드 없음</div>
        <button class="copy" id="copyBtn">복사</button>
      </div>

      <div class="steps">
        <b>등록 방법</b>
        <ol>
          <li>위 <b>복사</b> 버튼 누르기</li>
          <li>스타벅스 앱 → <b>Pay</b></li>
          <li><b>모바일 상품권</b> → <b>+ 버튼</b></li>
          <li><b>모바일 상품권 번호 입력</b> → 붙여넣기</li>
        </ol>
      </div>
      <div class="foot">Happy 마니또 🤫</div>
    </div>
  </div>

<script>
  var code = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  document.getElementById("code").textContent = code || "코드 없음";

  function confetti() {
    var chars = ["☕","🎉","🫘","✨","🟢","💚"];
    for (var i=0;i<26;i++){
      (function(){
        var el=document.createElement("div");
        el.className="confetti"; el.textContent=chars[i%chars.length];
        el.style.left=Math.random()*100+"vw";
        el.style.animationDuration=(2+Math.random()*2)+"s";
        el.style.animationDelay=(Math.random()*0.6)+"s";
        document.body.appendChild(el);
        setTimeout(function(){el.remove();},4800);
      })();
    }
  }

  document.getElementById("openBtn").addEventListener("click", function(){
    document.getElementById("wrap").style.display="none";
    document.getElementById("reveal").classList.add("show");
    confetti();
  });

  var btn=document.getElementById("copyBtn");
  btn.addEventListener("click", function(){
    if(!code) return;
    var copyCode = code.replace(/\s+/g, "");  // 화면엔 띄어쓰기, 복사는 공백 제거
    var done=function(){ btn.textContent="복사됨 ✓"; btn.classList.add("done");
      setTimeout(function(){btn.textContent="복사"; btn.classList.remove("done");},1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(copyCode).then(done, fb);
    } else { fb(); }
    function fb(){
      var t=document.createElement("textarea"); t.value=copyCode;
      t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t);
      t.focus(); t.select();
      try{ document.execCommand("copy"); done(); }catch(e){ alert("코드: "+copyCode); }
      document.body.removeChild(t);
    }
  });
</script>
</body>
</html>
